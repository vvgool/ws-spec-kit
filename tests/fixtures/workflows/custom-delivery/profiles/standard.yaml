version: 1
profile:
  id: standard
  workflow: custom-delivery
steps:
  clarify:
    approval: true
    artifacts:
      specification: { required: true, contentLevel: complete }
  design:
    approval: true
    artifacts:
      design: { required: true, contentLevel: complete }
  plan:
    artifacts:
      tasks: { required: true, contentLevel: complete }
  review-fix: { maxIterations: 5 }
  verify-green: { gates: [test] }
publishing: { issueRequired: false, knowledgeRequired: false, readBackRequired: false }
audit:
  level: standard
  retention: standard
  recordDecisions: false
  recordApprovals: false
  recordActors: false
  recordPublishing: false
