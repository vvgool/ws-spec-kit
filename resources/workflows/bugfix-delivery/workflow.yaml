version: 1
workflow:
  id: bugfix-delivery
  version: 1
inputs:
  requirement:
    accepts:
      - user.prompt
      - local.file
      - github.issue
      - gitlab.issue
      - feishu.document
steps:
  - id: intake
    uses: connector.execute
    workspace: read-only
    action: requirement.capture
    inputs:
      - requirement-source
    outputs:
      - requirement-source
  - id: explore
    uses: agent.execute
    workspace: read-only
    needs:
      - intake
    inputs:
      - requirement-source
    objective: 复现故障、定位根因，并用一份修复任务记录说明影响范围、最小改动和回归验收；不重复编写 PRD 或独立设计文档
    skills:
      - ref: builtin://skills/bugfix-diagnosis
        required: true
    outputs:
      - tasks
  - id: write-tests
    uses: agent.execute
    workspace: isolated-worktree
    needs:
      - explore
    inputs:
      - tasks
    objective: 根据当前任务先编写能够因缺少功能而失败的测试
    skills:
      - ref: builtin://skills/tdd-implementation
        required: true
    outputs:
      - red-test-result
  - id: verify-red
    uses: command.execute
    workspace: isolated-worktree
    action: quality.test
    expectedOutcome: test-failure
    needs:
      - write-tests
    inputs:
      - red-test-result
    outputs:
      - red-evidence
  - id: implement
    uses: agent.execute
    workspace: isolated-worktree
    actorRole: implementation
    needs:
      - verify-red
    inputs:
      - tasks
    objective: 在保留 Red 测试的前提下完成最小实现
    skills:
      - ref: builtin://skills/tdd-implementation
        required: true
    outputs:
      - implementation-result
  - id: verify-green
    uses: command.execute
    workspace: isolated-worktree
    action: quality.test
    expectedOutcome: success
    needs:
      - implement
    inputs:
      - red-evidence
    outputs:
      - tdd-evidence
  - id: review-fix
    uses: control.loop
    workspace: isolated-worktree
    needs:
      - verify-green
    until: ${artifacts.review-result.approved}
    maxIterations: 5
    steps:
      - id: review
        uses: agent.execute
        workspace: isolated-worktree
        actorRole: review
        skills:
          - ref: builtin://skills/code-review
            required: true
        outputs:
          - review-result
      - id: fix
        uses: agent.execute
        workspace: isolated-worktree
        actorRole: fix
        when: ${artifacts.review-result.approved == false}
        skills:
          - ref: builtin://skills/bug-fixing
            required: true
      - id: verify
        uses: command.execute
        workspace: isolated-worktree
        action: quality.verify
  - id: commit
    uses: connector.execute
    workspace: isolated-worktree
    action: git.commit
    needs:
      - review-fix
    approval: required
  - id: update-issue
    uses: connector.execute
    workspace: read-only
    action: issue.update
    needs:
      - commit
    inputs:
      - implementation-result
    when: ${bindings.issue.exists}
  - id: update-wiki
    uses: connector.execute
    workspace: read-only
    action: knowledge.publish
    needs:
      - update-issue
    inputs:
      - implementation-result
    when: ${bindings.knowledge.exists}
  - id: close-issue
    uses: connector.execute
    workspace: read-only
    action: issue.close
    needs:
      - update-wiki
    when: ${bindings.issue.exists}
    approval: required
  - id: close
    uses: control.close
    workspace: read-only
    needs:
      - close-issue
gates:
  - id: test
    evidence: trusted
    command:
      - wspec
      - gate
      - test
  - id: verify-red
    evidence: trusted
    command:
      - wspec
      - gate
      - test
      - --expect-failure
  - id: verify-green
    evidence: trusted
    command:
      - wspec
      - gate
      - test
changePolicy:
  kind: feature
  allowedPaths:
    - "**"
