version: 1
workflow:
  id: documentation-delivery
  version: 1
inputs:
  requirement:
    accepts: [user.prompt, local.file, github.issue, gitlab.issue, feishu.document]
steps:
  - id: intake
    uses: connector.execute
    action: requirement.capture
    inputs: [requirement-source]
    outputs: [requirement-source]
  - id: explore
    uses: agent.execute
    needs: [intake]
    inputs: [requirement-source]
    skills:
      - ref: builtin://skills/documentation-exploration
        required: true
    outputs: [documentation-context]
  - id: clarify
    uses: agent.execute
    needs: [explore]
    inputs: [documentation-context]
    skills:
      - ref: builtin://skills/requirement-exploration
        required: true
    outputs: [specification]
  - id: plan
    uses: agent.execute
    needs: [clarify]
    inputs: [specification]
    skills:
      - ref: builtin://skills/task-planning
        required: true
    outputs: [tasks]
  - id: edit-document
    uses: agent.execute
    needs: [plan]
    inputs: [tasks]
    skills:
      - ref: builtin://skills/documentation-editing
        required: true
    outputs: [documentation-result]
  - id: verify-document
    uses: command.execute
    action: quality.docs.integrity
    needs: [edit-document]
    inputs: [documentation-result]
    outputs: [documentation-evidence]
  - id: review-fix
    uses: control.loop
    needs: [verify-document]
    inputs: [documentation-evidence]
    until: ${artifacts.review-result.approved}
    maxIterations: 5
    steps:
      - id: review
        uses: agent.execute
        skills:
          - ref: builtin://skills/documentation-review
            required: true
        outputs: [review-result]
      - id: fix
        uses: agent.execute
        when: ${artifacts.review-result.approved == false}
        skills:
          - ref: builtin://skills/documentation-editing
            required: true
      - id: verify
        uses: command.execute
        action: quality.docs.integrity
  - id: commit
    uses: connector.execute
    action: git.commit
    needs: [review-fix]
    approval: required
  - id: update-issue
    uses: connector.execute
    action: issue.update
    needs: [commit]
    when: ${bindings.issue.exists}
  - id: update-wiki
    uses: connector.execute
    action: knowledge.publish
    needs: [update-issue]
    when: ${bindings.knowledge.exists}
  - id: close-issue
    uses: connector.execute
    action: issue.close
    needs: [update-wiki]
    when: ${bindings.issue.exists}
    approval: required
  - id: close
    uses: control.close
    needs: [close-issue]
gates:
  - id: docs.integrity
    evidence: trusted
    command: [wspec, gate, docs.integrity]
changePolicy:
  kind: documentation-only
  allowedPaths: ["README*.md", "CHANGELOG*.md", "docs/**/*.md", "docs/**/*.mdx", "docs/**/*.txt"]
